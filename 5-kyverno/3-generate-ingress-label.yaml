apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-ingress
spec:
  rules:
    - name: generate-ingress
      match:
        all:
          - resources:
              kinds:
                - Service
              selector:
                matchExpressions:
                - key: httphost
                  operator: Exists
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      generate:
        kind: Ingress
        apiVersion: networking.k8s.io/v1
        name: '{{request.object.metadata.name}}'
        namespace: '{{request.object.metadata.namespace}}'
        data:
          spec:
            rules:
            - host: '{{request.object.metadata.labels.httphost}}'
              #.{{request.object.metadata.namespace}}.tipjam.xyz'
              http:
                paths:
                - backend:
                    service:
                      name: '{{request.object.metadata.name}}'
                      port:
                        number: '{{request.object.spec.ports[0].targetPort}}'
                  path: /
                  pathType: Prefix
